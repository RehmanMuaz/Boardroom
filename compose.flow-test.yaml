# Isolated disposable test service, bound to loopback on a separate port.
services:
 postgres:
  image: postgres:17-alpine
  environment:
   POSTGRES_DB: boardroom_test
   POSTGRES_USER: boardroom_test
   POSTGRES_PASSWORD: local-test-only
  ports: ["127.0.0.1:55432:5432"]
  healthcheck:
   test: ["CMD-SHELL", "pg_isready -U boardroom_test -d boardroom_test"]
   interval: 2s
   timeout: 3s
   retries: 30
